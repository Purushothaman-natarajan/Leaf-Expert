services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leaf-expert-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - DEVICE=auto
      - CORS_ORIGINS=http://localhost:3000
      - DEBUG=false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leaf-expert-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: leaf-expert-network
